<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama entidad-relación final de Pedidos360</title>
  <desc id="desc">Modelo final de inventario y pedidos B2B con categorías, productos, clientes, pedidos, detalles, usuarios y roles.</desc>
  <style>
    .bg { fill: #f7fafc; }
    .title { font: 700 40px Aptos, Arial, sans-serif; fill: #102a43; }
    .subtitle { font: 400 20px Aptos, Arial, sans-serif; fill: #52606d; }
    .entity { fill: #ffffff; stroke: #1769aa; stroke-width: 3; }
    .header { fill: #102a43; }
    .name { font: 700 23px Aptos, Arial, sans-serif; fill: #ffffff; }
    .field { font: 400 17px Aptos, Arial, sans-serif; fill: #18212f; }
    .key { font: 700 17px Aptos, Arial, sans-serif; fill: #1769aa; }
    .rel { stroke: #1769aa; stroke-width: 3.5; fill: none; }
    .relText { font: 700 18px Aptos, Arial, sans-serif; fill: #1769aa; }
    .note { font: 400 16px Aptos, Arial, sans-serif; fill: #52606d; }
    .future { fill: #fff8e8; stroke: #d99000; stroke-width: 3; }
    .futureHeader { fill: #9b6500; }
    .legend { font: 700 16px Aptos, Arial, sans-serif; fill: #18212f; }
  </style>
  <rect class="bg" width="1920" height="1180"/>
  <text class="title" x="70" y="74">Pedidos360 · Modelo entidad–relación final</text>
  <text class="subtitle" x="70" y="111">Inventario y pedidos B2B · Diseño final objetivo del proyecto</text>
  <line x1="70" y1="140" x2="1850" y2="140" stroke="#c8d5df" stroke-width="2"/>

  <!-- CATEGORIAS: implemented -->
  <rect class="entity" x="70" y="245" width="275" height="220" rx="16"/>
  <path class="header" d="M86 245 H329 A16 16 0 0 1 345 261 V315 H70 V261 A16 16 0 0 1 86 245Z"/>
  <text class="name" x="95" y="280">CATEGORIAS</text>
  <text class="key" x="95" y="350">PK  Id : int</text>
  <text class="field" x="95" y="390">Nombre : string(80)</text>
  <text class="field" x="95" y="430">UNIQUE (Nombre)</text>

  <!-- PRODUCTOS: implemented -->
  <rect class="entity" x="430" y="205" width="335" height="355" rx="16"/>
  <path class="header" d="M446 205 H749 A16 16 0 0 1 765 221 V275 H430 V221 A16 16 0 0 1 446 205Z"/>
  <text class="name" x="455" y="240">PRODUCTOS</text>
  <text class="key" x="455" y="310">PK  Id : int</text>
  <text class="key" x="455" y="348">FK  CategoriaId : int</text>
  <text class="field" x="455" y="386">Nombre : string(120)</text>
  <text class="field" x="455" y="424">Precio : decimal(12,2)</text>
  <text class="field" x="455" y="462">ImpuestoPorc : decimal(5,2)</text>
  <text class="field" x="455" y="500">Stock : int · Activo : bool</text>
  <text class="field" x="455" y="538">ImagenBytes : varbinary(max) · ImagenTipo</text>

  <!-- CLIENTES: implemented -->
  <rect class="entity" x="70" y="675" width="330" height="315" rx="16"/>
  <path class="header" d="M86 675 H384 A16 16 0 0 1 400 691 V745 H70 V691 A16 16 0 0 1 86 675Z"/>
  <text class="name" x="95" y="710">CLIENTES</text>
  <text class="key" x="95" y="780">PK  Id : int</text>
  <text class="field" x="95" y="818">Nombre : string(120)</text>
  <text class="field" x="95" y="856">Cedula : string(30) UNIQUE</text>
  <text class="field" x="95" y="894">Correo · Teléfono · Dirección</text>

  <!-- PEDIDOS: future -->
  <rect class="future" x="805" y="595" width="360" height="350" rx="16"/>
  <path class="futureHeader" d="M821 595 H1149 A16 16 0 0 1 1165 611 V665 H805 V611 A16 16 0 0 1 821 595Z"/>
  <text class="name" x="830" y="630">PEDIDOS</text>
  <text class="key" x="830" y="700">PK  Id : int</text>
  <text class="key" x="830" y="738">FK  ClienteId : int</text>
  <text class="key" x="830" y="776">FK  UsuarioId : string</text>
  <text class="field" x="830" y="814">Fecha : datetime2 · Estado : enum</text>
  <text class="field" x="830" y="852">Subtotal · Impuestos · Descuento</text>
  <text class="field" x="830" y="890">Total : decimal(18,2)</text>

  <!-- PEDIDO DETALLES: future -->
  <rect class="future" x="1265" y="575" width="380" height="390" rx="16"/>
  <path class="futureHeader" d="M1281 575 H1629 A16 16 0 0 1 1645 591 V645 H1265 V591 A16 16 0 0 1 1281 575Z"/>
  <text class="name" x="1290" y="610">PEDIDO_DETALLES</text>
  <text class="key" x="1290" y="680">PK  Id : int</text>
  <text class="key" x="1290" y="718">FK  PedidoId : int</text>
  <text class="key" x="1290" y="756">FK  ProductoId : int</text>
  <text class="field" x="1290" y="794">Cantidad : int</text>
  <text class="field" x="1290" y="832">PrecioUnitario : decimal(18,2)</text>
  <text class="field" x="1290" y="870">TipoDescuento · Descuento</text>
  <text class="field" x="1290" y="908">ImpuestoPorc · TotalLinea</text>

  <!-- USERS -->
  <rect class="future" x="1215" y="205" width="300" height="230" rx="16"/>
  <path class="futureHeader" d="M1231 205 H1499 A16 16 0 0 1 1515 221 V275 H1215 V221 A16 16 0 0 1 1231 205Z"/>
  <text class="name" x="1240" y="240">ASPNETUSERS</text>
  <text class="key" x="1240" y="310">PK  Id : string</text>
  <text class="field" x="1240" y="348">Email : string(256)</text>
  <text class="field" x="1240" y="386">UserName : string(256)</text>
  <text class="note" x="1240" y="416">ASP.NET Identity</text>

  <!-- USER ROLES -->
  <rect class="future" x="1570" y="235" width="270" height="185" rx="16"/>
  <path class="futureHeader" d="M1586 235 H1824 A16 16 0 0 1 1840 251 V305 H1570 V251 A16 16 0 0 1 1586 235Z"/>
  <text class="name" x="1595" y="270">ASPNETUSERROLES</text>
  <text class="key" x="1595" y="340">PK, FK  UserId</text>
  <text class="key" x="1595" y="380">PK, FK  RoleId</text>

  <!-- ROLES -->
  <rect class="future" x="1570" y="480" width="270" height="175" rx="16"/>
  <path class="futureHeader" d="M1586 480 H1824 A16 16 0 0 1 1840 496 V550 H1570 V496 A16 16 0 0 1 1586 480Z"/>
  <text class="name" x="1595" y="515">ASPNETROLES</text>
  <text class="key" x="1595" y="585">PK  Id : string</text>
  <text class="field" x="1595" y="625">Name : Admin / Ventas / Operaciones</text>

  <!-- Relations -->
  <path class="rel" d="M345 355 H430"/>
  <text class="relText" x="360" y="338">1</text><text class="relText" x="400" y="338">N</text>
  <text class="note" x="345" y="382">clasifica</text>

  <path class="rel" d="M400 830 H610 V770 H805"/>
  <text class="relText" x="422" y="812">1</text><text class="relText" x="774" y="752">N</text>
  <text class="note" x="545" y="754">realiza</text>

  <path class="rel" d="M1165 770 H1265"/>
  <text class="relText" x="1185" y="752">1</text><text class="relText" x="1235" y="752">N</text>
  <text class="note" x="1175" y="805">contiene</text>

  <path class="rel" d="M765 470 H1020 V1040 H1455 V965"/>
  <text class="relText" x="785" y="452">1</text><text class="relText" x="1425" y="1018">N</text>
  <text class="note" x="1040" y="1070">se registra en</text>

  <path class="rel" d="M1365 435 V530 H985 V595"/>
  <text class="relText" x="1380" y="465">1</text><text class="relText" x="1000" y="575">N</text>
  <text class="note" x="1080" y="515">registra</text>

  <path class="rel" d="M1515 320 H1570"/>
  <text class="relText" x="1524" y="302">N</text><text class="relText" x="1550" y="302">N</text>
  <path class="rel" d="M1705 420 V480"/>
  <text class="note" x="1500" y="455">asigna roles</text>

  <!-- Legend -->
  <rect x="70" y="1050" width="1770" height="80" rx="12" fill="#eaf3f8" stroke="#2e90c9" stroke-width="2"/>
  <rect x="100" y="1072" width="24" height="24" fill="#102a43"/><text class="legend" x="138" y="1091">Implementado en Azure SQL (Hito 1)</text>
  <rect x="550" y="1072" width="24" height="24" fill="#9b6500"/><text class="legend" x="588" y="1091">Diseño final pendiente de implementar</text>
  <text class="note" x="1100" y="1091">PK: clave primaria · FK: clave foránea · 1:N: uno a muchos</text>
</svg>
